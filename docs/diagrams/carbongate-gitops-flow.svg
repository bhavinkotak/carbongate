<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="carbongate-gitops-flow-title carbongate-gitops-flow-desc" id="carbongate-gitops-flow-root">
        <title id="carbongate-gitops-flow-title">CarbonGate GitOps admission flowchart</title>
        <desc id="carbongate-gitops-flow-desc">Flowchart showing a Kubernetes GitOps sync checked for urgent bypass, scored against grid carbon-intensity forecasts within its SLA window, deferred to a cleaner slot or promoted immediately, and rolled out to the cluster.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #carbongate-gitops-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #carbongate-gitops-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #carbongate-gitops-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#carbongate-gitops-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="carbongate-gitops-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="carbongate-gitops-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="carbongate-gitops-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="carbongate-gitops-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- 1. Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#carbongate-gitops-flow-dots)" opacity="0.55"/>

        <!-- 2. Orthogonal connectors -->
        <line x1="440" y1="84" x2="440" y2="116" stroke="#bf4520" stroke-width="1.4" marker-end="url(#carbongate-gitops-flow-arrow-accent)"/>
        <line x1="544" y1="164" x2="700" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#carbongate-gitops-flow-arrow)"/>
        <line x1="440" y1="212" x2="440" y2="248" stroke="#bf4520" stroke-width="1.4" marker-end="url(#carbongate-gitops-flow-arrow-accent)"/>
        <line x1="440" y1="308" x2="440" y2="340" stroke="#bf4520" stroke-width="1.4" marker-end="url(#carbongate-gitops-flow-arrow-accent)"/>
        <line x1="552" y1="388" x2="700" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#carbongate-gitops-flow-arrow)"/>
        <line x1="440" y1="436" x2="440" y2="472" stroke="#bf4520" stroke-width="1.4" marker-end="url(#carbongate-gitops-flow-arrow-accent)"/>
        <path d="M 790,416 V 468 Q 790,476 782,476 H 444"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#carbongate-gitops-flow-arrow)"/>
        <line x1="440" y1="480" x2="440" y2="508" stroke="#bf4520" stroke-width="1.4" marker-end="url(#carbongate-gitops-flow-arrow-accent)"/>
        <path d="M 880,164 H 916 Q 924,164 924,172 V 528 Q 924,536 916,536 H 540"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#carbongate-gitops-flow-arrow)"/>
        <line x1="440" y1="564" x2="440" y2="596" stroke="#bf4520" stroke-width="1.4" marker-end="url(#carbongate-gitops-flow-arrow-accent)"/>

        <!-- 3. Arrow labels -->
        <rect x="608" y="144" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="622" y="153" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">YES</text>

        <rect x="448" y="222" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="231" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">NO</text>

        <rect x="604" y="368" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="626" y="377" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">DEFER</text>

        <rect x="448" y="446" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="474" y="455" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">PROMOTE</text>

        <rect x="580" y="456" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="614" y="465" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">SLOT READY</text>

        <rect x="704" y="516" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="728" y="525" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">BYPASS</text>

        <!-- 4. Nodes -->
        <!-- Start oval -->
        <rect x="340" y="36" width="200" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="340" y="36" width="200" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="440" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitOps Sync Request</text>
        <text x="440" y="72" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Argo CD · Flux · Tekton</text>

        <!-- Decision 1: Urgent / hotfix? -->
        <polygon points="440,116 544,164 440,212 336,164" fill="#f5f5f5"/>
        <polygon points="440,116 544,164 440,212 336,164" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="440" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Urgent or</text>
        <text x="440" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hotfix sync?</text>

        <!-- Branch step: Urgent Bypass -->
        <rect x="700" y="136" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="136" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="790" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Immediate Bypass</text>
        <text x="790" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">critical · 0s gate wait</text>

        <!-- Step 1: CarbonGate Controller (Focal Coral #1) -->
        <rect x="344" y="248" width="192" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="344" y="248" width="192" height="60" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="440" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CarbonGate Controller</text>
        <text x="440" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NESO · WattTime · cache</text>

        <!-- Decision 2: Cleaner slot in SLA? (Focal Coral #2) -->
        <polygon points="440,340 552,388 440,436 328,388" fill="#f5f5f5"/>
        <polygon points="440,340 552,388 440,436 328,388" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="440" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cleaner slot</text>
        <text x="440" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">inside SLA?</text>

        <!-- Branch step: Defer to Min Slot -->
        <rect x="700" y="360" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="360" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="790" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Defer to Argmin Slot</text>
        <text x="790" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">delta &gt;= 5% · 4h SLA</text>

        <!-- Merge dot -->
        <circle cx="440" cy="476" r="4" fill="#2d3142"/>

        <!-- Step 2: Cluster Rollout -->
        <rect x="340" y="508" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="508" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="440" y="534" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kubernetes Rollout</text>
        <text x="440" y="550" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PreSync hook · K8s apply</text>

        <!-- End oval -->
        <rect x="340" y="596" width="200" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="340" y="596" width="200" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="440" y="618" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Record Carbon Verdict</text>
        <text x="440" y="632" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Prometheus · audit JSON</text>

        <!-- 5. Horizontal bottom LEGEND strip -->
        <line x1="40" y1="664" x2="960" y2="664" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="678" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="688" width="20" height="12" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="68" y="697" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

        <rect x="156" y="688" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="184" y="697" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

        <polygon points="244,694 256,688 268,694 256,700" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="276" y="697" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <rect x="356" y="688" width="20" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="384" y="697" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal gate</text>

        <line x1="476" y1="694" x2="504" y2="694" stroke="#bf4520" stroke-width="1.4" marker-end="url(#carbongate-gitops-flow-arrow-accent)"/>
        <text x="512" y="697" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary admission path</text>

        <line x1="680" y1="694" x2="708" y2="694" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#carbongate-gitops-flow-arrow)"/>
        <text x="716" y="697" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Deferred / bypass rejoin</text>
      </svg>
