[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carbongate"
version = "1.0.0"
description = "Carbon-Aware Quality Gates for Kubernetes GitOps"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Bhavin Kotak", email = "bhavin.kotak@ibm.com"}
]
keywords = [
    "green-computing",
    "gitops",
    "kubernetes",
    "carbon-aware",
    "sustainable-software",
    "devops",
    "continuous-delivery"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "flake8>=6.1.0",
]
kubernetes = [
    "kubernetes>=28.0.0",
]
full = [
    "kubernetes>=28.0.0",
    "prometheus-client>=0.17.0",
    "redis>=4.5.0",
]

[project.scripts]
carbongate = "carbongate.cli:main"

[project.urls]
Homepage = "https://github.com/bhavinkotak/carbongate"
Documentation = "https://github.com/bhavinkotak/carbongate#readme"
Repository = "https://github.com/bhavinkotak/carbongate"
Issues = "https://github.com/bhavinkotak/carbongate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
